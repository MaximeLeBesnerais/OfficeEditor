name: guard-main

on:
  pull_request:
    branches: [main]

jobs:
  enforce-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require PRs into main to come from dev
        if: github.head_ref != 'dev'
        run: |
          echo "::error::PRs into main must come from dev (head ref: '${{ github.head_ref }}')."
          exit 1

      - name: Source branch OK
        run: echo "PR into main comes from dev. OK."
