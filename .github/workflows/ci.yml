name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 41 # floor — raise as coverage grows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage gate
        run: python3 scripts/check-coverage.py --threshold ${{ env.COVERAGE_THRESHOLD }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
