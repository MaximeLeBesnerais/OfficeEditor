name: mirror-gitcode

# One-way mirror of this repo to GitCode (gitcode.com/xyj_maxime/OfficeEditor).
# Runs on every push to main/dev and on v* tags, plus manually.

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITCODE_USERNAME: ${{ secrets.GITCODE_USERNAME }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPO: OfficeEditor
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitCode repo if missing
        run: |
          set -euo pipefail
          repo_url="https://gitcode.com/${GITCODE_USERNAME}/${GITCODE_REPO}"
          code="$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$repo_url")"
          if [ "$code" = "404" ]; then
            echo "Repo missing — creating via GitCode v5 API"
            resp="$(curl -s -X POST "https://gitcode.com/api/v5/user/repos" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${GITCODE_TOKEN}\",\"name\":\"${GITCODE_REPO}\",\
                   \"description\":\"Declarative Office document generation — DOCX/PPTX/XLSX (mirror of github.com/MaximeLeBesnerais/OfficeEditor)\",\
                   \"private\":false,\"auto_init\":false}")"
            echo "$resp"
          else
            echo "Repo already exists (HTTP $code)"
          fi

      - name: Push mirror
        run: |
          set -euo pipefail
          git remote add gitcode "https://${GITCODE_USERNAME}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_USERNAME}/${GITCODE_REPO}.git" 2>/dev/null || true
          git push --force gitcode \
            "refs/heads/main:refs/heads/main" \
            "refs/heads/dev:refs/heads/dev" \
            --tags
