name: mirror-gitcode

# One-way mirror of this repo to GitCode (gitcode.com/xyj_maxime/OfficeEditor).
# Runs on every push to main and on v* tags, plus manually. The single run pushes
# BOTH main and dev (dev is fast-forwarded to main before every dual push), so a
# main-only trigger avoids two concurrent runs racing each other on the remote.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITCODE_USERNAME: ${{ secrets.GITCODE_USERNAME }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_REPO: OfficeEditor
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Create GitCode repo if missing
        run: |
          set -euo pipefail
          repo_url="https://gitcode.com/${GITCODE_USERNAME}/${GITCODE_REPO}"
          code="$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$repo_url")"
          if [ "$code" = "404" ]; then
            echo "Repo missing — creating via GitCode v5 API"
            curl -s -X POST "https://gitcode.com/api/v5/user/repos" \
              -H "PRIVATE-TOKEN: ${GITCODE_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"${GITCODE_REPO}\",\
                   \"description\":\"Declarative Office document generation — DOCX/PPTX/XLSX (mirror of github.com/MaximeLeBesnerais/OfficeEditor)\",\
                   \"private\":false,\"auto_init\":false}" \
              -w "\ncreate HTTP %{http_code}\n"
          else
            echo "Repo already exists (HTTP $code)"
          fi

      - name: Push mirror
        run: |
          set -euo pipefail
          git push --force \
            "https://${GITCODE_USERNAME}:${GITCODE_TOKEN}@gitcode.com/${GITCODE_USERNAME}/${GITCODE_REPO}.git" \
            "refs/remotes/origin/main:refs/heads/main" \
            "refs/remotes/origin/dev:refs/heads/dev" \
            --tags
