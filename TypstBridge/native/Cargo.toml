[package]
name = "typst_bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Already a transitive dependency of typst 0.14.2 (pinned to the exact version in
# Cargo.lock); promoted to a direct dependency so the bridge can drive
# `comemo::evict` for bounded memoization in long-lived processes.
comemo = "=0.5.1"
typst = "=0.14.2"
typst-kit = { version = "=0.14.2", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "=0.14.2"
typst-render = "=0.14.2"
typst-svg = "=0.14.2"
typst-utils = "=0.14.2"
tiny-skia = { version = "0.11.4", features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
