[package]
name = "typst_bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "=0.14.2"
typst-kit = { version = "=0.14.2", default-features = false, features = ["fonts", "embed-fonts"] }
typst-pdf = "=0.14.2"
typst-render = "=0.14.2"
typst-svg = "=0.14.2"
typst-utils = "=0.14.2"
tiny-skia = { version = "0.11.4", features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
